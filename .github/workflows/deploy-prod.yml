name: Deploy Prod

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      deploy_mode:
        description: Deployment mode
        required: false
        default: prod
        type: choice
        options:
          - prod
          - all
          - app
          - frontend
          - backend
          - ml
      restore_source:
        description: Optional restore source (helvex-pg-YYYYMMDDTHHMMSSZ); leave empty to use restore-point file
        required: false
        default: ""
        type: string
      qemu_backend:
        description: Build the backend image with QEMU (amd64+arm64)
        required: false
        default: false
        type: boolean
      qemu_ml_base:
        description: Build the ML base image with QEMU (amd64+arm64)
        required: true
        default: true
        type: boolean
      qemu_ml:
        description: Build the ML worker image with QEMU (amd64+arm64)
        required: true
        default: true
        type: boolean
      qemu_frontend:
        description: Build the frontend image with QEMU (amd64+arm64)
        required: false
        default: false
        type: boolean

# ── Reusable condition fragments (referenced via jobs.<id>.if) ────────────────
# A push triggers builds only when a deploy tag is in the commit message.
# Workflow dispatch always triggers (deploy_mode input selects which components).

jobs:
  # ── Parallel build jobs ───────────────────────────────────────────────────
  build-backend:
    if: |
      (
        github.event_name == 'workflow_dispatch' ||
        contains(github.event.head_commit.message, '[deploy-prod]') ||
        contains(github.event.head_commit.message, '[deploy-all]') ||
        contains(github.event.head_commit.message, '[deploy-app]') ||
        contains(github.event.head_commit.message, '[deploy-frontend]') ||
        contains(github.event.head_commit.message, '[deploy-backend]') ||
        contains(github.event.head_commit.message, '[deploy-ml]') ||
        contains(github.event.head_commit.message, '[deploy-http]')
      ) && (
        (github.event_name != 'workflow_dispatch' && !contains(github.event.head_commit.message, '[deploy-frontend]') && !contains(github.event.head_commit.message, '[deploy-ml]')) ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_mode != 'frontend' && github.event.inputs.deploy_mode != 'ml')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    env:
      USE_QEMU: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.qemu_backend == 'true') || (github.event_name != 'workflow_dispatch' && vars.BUILD_QEMU_BACKEND == 'true') }}
      BUILD_PLATFORMS: ${{ ((github.event_name == 'workflow_dispatch' && github.event.inputs.qemu_backend == 'true') || (github.event_name != 'workflow_dispatch' && vars.BUILD_QEMU_BACKEND == 'true')) && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT != '' && secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Set up QEMU
        if: env.USE_QEMU == 'true'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Build and push backend
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          provenance: false
          platforms: ${{ env.BUILD_PLATFORMS }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            BUILD_GIT_SHA=${{ github.sha }}
            INSTALL_SPACY_MODEL=false
            BUILD_GEOCODING_DB=false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Scan image for vulnerabilities (backend)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true # report-only — scanner crashes (registry hiccups etc.) must not block deploy; see roadmap.md
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ github.sha }}
          format: sarif
          output: trivy-backend.sarif
          severity: CRITICAL,HIGH
          exit-code: "0" # report-only — see roadmap.md for promoting to a hard gate

      - name: Upload Trivy results to GitHub Security tab (backend)
        if: always()
        uses: github/codeql-action/upload-sarif@v3 # Renovate will SHA-pin on first run
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

      - name: Upload Trivy results as artifact (backend)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-backend-${{ github.sha }}
          path: trivy-backend.sarif
          if-no-files-found: ignore

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign image
        continue-on-error: true
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}

  build-ml-base:
    # Rebuilds the heavy base layer (pip deps + spaCy model + geocoding DB).
    # GHA cache makes this near-instant when requirements.*.txt / geocoding_client.py are unchanged.
    if: |
      (
        github.event_name == 'workflow_dispatch' ||
        contains(github.event.head_commit.message, '[deploy-prod]') ||
        contains(github.event.head_commit.message, '[deploy-all]') ||
        contains(github.event.head_commit.message, '[deploy-app]') ||
        contains(github.event.head_commit.message, '[deploy-frontend]') ||
        contains(github.event.head_commit.message, '[deploy-backend]') ||
        contains(github.event.head_commit.message, '[deploy-ml]')
      ) && (
        (github.event_name != 'workflow_dispatch' && !contains(github.event.head_commit.message, '[deploy-frontend]') && !contains(github.event.head_commit.message, '[deploy-backend]') && !contains(github.event.head_commit.message, '[deploy-app]')) ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_mode != 'frontend' && github.event.inputs.deploy_mode != 'backend' && github.event.inputs.deploy_mode != 'app')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    env:
      # On push: always build multi-arch for ML. On workflow_dispatch: respect the inputs.
      USE_QEMU: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.qemu_ml_base == 'true' || github.event.inputs.qemu_ml == 'true' }}
      BUILD_PLATFORMS: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.qemu_ml_base == 'true' || github.event.inputs.qemu_ml == 'true') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT != '' && secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Set up QEMU
        if: env.USE_QEMU == 'true'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Build and push ml-base
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.ml-base
          push: true
          provenance: false
          platforms: ${{ env.BUILD_PLATFORMS }}
          tags: ghcr.io/${{ github.repository }}-ml-base:latest
          cache-from: type=gha,scope=ml-base
          cache-to: type=gha,mode=max,scope=ml-base

      - name: Scan image for vulnerabilities (ml-base)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true # report-only — scanner crashes (registry hiccups etc.) must not block deploy; see roadmap.md
        with:
          image-ref: ghcr.io/${{ github.repository }}-ml-base:latest
          format: sarif
          output: trivy-ml-base.sarif
          severity: CRITICAL,HIGH
          exit-code: "0" # report-only — see roadmap.md for promoting to a hard gate

      - name: Upload Trivy results to GitHub Security tab (ml-base)
        if: always()
        uses: github/codeql-action/upload-sarif@v3 # Renovate will SHA-pin on first run
        with:
          sarif_file: trivy-ml-base.sarif
          category: trivy-ml-base

      - name: Upload Trivy results as artifact (ml-base)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-ml-base-${{ github.sha }}
          path: trivy-ml-base.sarif
          if-no-files-found: ignore

  build-ml:
    # Fast build: just copies app code on top of ml-base.
    # Automatically skipped when build-ml-base is skipped (e.g. [deploy-backend]).
    needs: build-ml-base
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    env:
      # On push: always build multi-arch for ML. On workflow_dispatch: respect the inputs.
      USE_QEMU: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.qemu_ml_base == 'true' || github.event.inputs.qemu_ml == 'true' }}
      BUILD_PLATFORMS: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.qemu_ml_base == 'true' || github.event.inputs.qemu_ml == 'true') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT != '' && secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Set up QEMU
        if: env.USE_QEMU == 'true'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Build and push ml worker
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.ml
          push: true
          provenance: false
          platforms: ${{ env.BUILD_PLATFORMS }}
          tags: |
            ghcr.io/${{ github.repository }}-ml:latest
            ghcr.io/${{ github.repository }}-ml:${{ github.sha }}
          build-args: |
            ML_BASE_IMAGE=ghcr.io/${{ github.repository }}-ml-base:latest
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            BUILD_GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=ml-worker
          cache-to: type=gha,mode=max,scope=ml-worker

      - name: Scan image for vulnerabilities (ml)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true # report-only — scanner crashes (registry hiccups etc.) must not block deploy; see roadmap.md
        with:
          image-ref: ghcr.io/${{ github.repository }}-ml:${{ github.sha }}
          format: sarif
          output: trivy-ml.sarif
          severity: CRITICAL,HIGH
          exit-code: "0" # report-only — see roadmap.md for promoting to a hard gate

      - name: Upload Trivy results to GitHub Security tab (ml)
        if: always()
        uses: github/codeql-action/upload-sarif@v3 # Renovate will SHA-pin on first run
        with:
          sarif_file: trivy-ml.sarif
          category: trivy-ml

      - name: Upload Trivy results as artifact (ml)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-ml-${{ github.sha }}
          path: trivy-ml.sarif
          if-no-files-found: ignore

  build-frontend:
    if: |
      (
        github.event_name == 'workflow_dispatch' ||
        contains(github.event.head_commit.message, '[deploy-prod]') ||
        contains(github.event.head_commit.message, '[deploy-all]') ||
        contains(github.event.head_commit.message, '[deploy-app]') ||
        contains(github.event.head_commit.message, '[deploy-frontend]') ||
        contains(github.event.head_commit.message, '[deploy-backend]') ||
        contains(github.event.head_commit.message, '[deploy-ml]')
      ) && (
        (github.event_name != 'workflow_dispatch' && !contains(github.event.head_commit.message, '[deploy-backend]') && !contains(github.event.head_commit.message, '[deploy-ml]')) ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_mode != 'backend' && github.event.inputs.deploy_mode != 'ml')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    env:
      USE_QEMU: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.qemu_frontend == 'true') || (github.event_name != 'workflow_dispatch' && vars.BUILD_QEMU_FRONTEND == 'true') }}
      BUILD_PLATFORMS: ${{ ((github.event_name == 'workflow_dispatch' && github.event.inputs.qemu_frontend == 'true') || (github.event_name != 'workflow_dispatch' && vars.BUILD_QEMU_FRONTEND == 'true')) && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT != '' && secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Set up QEMU
        if: env.USE_QEMU == 'true'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Build and push frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./frontend
          push: true
          provenance: false
          platforms: ${{ env.BUILD_PLATFORMS }}
          tags: |
            ghcr.io/${{ github.repository }}-frontend:latest
            ghcr.io/${{ github.repository }}-frontend:${{ github.sha }}
          build-args: |
            FASTAPI_URL=http://helvex:8000
            NEXT_PUBLIC_GTM_ID=${{ secrets.NEXT_PUBLIC_GTM_ID }}
            NEXT_PUBLIC_ADSENSE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_ADSENSE_CLIENT_ID }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
            NEXT_PUBLIC_UMAMI_WEBSITE_ID=${{ secrets.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
            NEXT_PUBLIC_UMAMI_SCRIPT_URL=${{ secrets.NEXT_PUBLIC_UMAMI_SCRIPT_URL }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Scan image for vulnerabilities (frontend)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true # report-only — scanner crashes (registry hiccups etc.) must not block deploy; see roadmap.md
        with:
          image-ref: ghcr.io/${{ github.repository }}-frontend:${{ github.sha }}
          format: sarif
          output: trivy-frontend.sarif
          severity: CRITICAL,HIGH
          exit-code: "0" # report-only — see roadmap.md for promoting to a hard gate

      - name: Upload Trivy results to GitHub Security tab (frontend)
        if: always()
        uses: github/codeql-action/upload-sarif@v3 # Renovate will SHA-pin on first run
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

      - name: Upload Trivy results as artifact (frontend)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-frontend-${{ github.sha }}
          path: trivy-frontend.sarif
          if-no-files-found: ignore

  # ── Deploy ────────────────────────────────────────────────────────────────
  deploy:
    needs: [build-backend, build-ml, build-frontend]
    # Run when no build job failed/cancelled (skipped builds are fine).
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (
        github.event_name == 'workflow_dispatch' ||
        contains(github.event.head_commit.message, '[deploy-prod]') ||
        contains(github.event.head_commit.message, '[deploy-all]') ||
        contains(github.event.head_commit.message, '[deploy-app]') ||
        contains(github.event.head_commit.message, '[deploy-frontend]') ||
        contains(github.event.head_commit.message, '[deploy-backend]') ||
        contains(github.event.head_commit.message, '[deploy-ml]') ||
        contains(github.event.head_commit.message, '[deploy-http]')
      )
    runs-on: helvex-prod
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_WORKFLOW_PAT }}

      - name: Setup tools
        run: |
          set -euo pipefail
          # Skip installs if tools are already present on the self-hosted runner.
          if ! command -v kubectl &>/dev/null; then
            KUBECTL_VERSION=$(curl -Ls https://dl.k8s.io/release/stable.txt)
            curl -sfLO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
            curl -sfLO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256"
            echo "$(cat kubectl.sha256)  kubectl" | sha256sum -c -
            chmod +x kubectl && sudo mv kubectl /usr/local/bin/kubectl
          fi
          if ! command -v helm &>/dev/null; then
            HELM_VERSION=3.21.1
            curl -sfLO "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
            curl -sfLO "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz.sha256sum"
            sha256sum -c "helm-v${HELM_VERSION}-linux-amd64.tar.gz.sha256sum"
            tar -xzf "helm-v${HELM_VERSION}-linux-amd64.tar.gz"
            sudo mv linux-amd64/helm /usr/local/bin/helm
            chmod +x /usr/local/bin/helm
          fi
          if ! command -v helmfile &>/dev/null; then
            HELMFILE_VERSION=0.171.0
            ( cd /tmp && \
              curl -sfLO "https://github.com/helmfile/helmfile/releases/download/v${HELMFILE_VERSION}/helmfile_${HELMFILE_VERSION}_checksums.txt" && \
              curl -sfLO "https://github.com/helmfile/helmfile/releases/download/v${HELMFILE_VERSION}/helmfile_${HELMFILE_VERSION}_linux_amd64.tar.gz" && \
              grep "helmfile_${HELMFILE_VERSION}_linux_amd64.tar.gz" "helmfile_${HELMFILE_VERSION}_checksums.txt" | sha256sum -c - && \
              tar -xzf "helmfile_${HELMFILE_VERSION}_linux_amd64.tar.gz" )
            sudo mv /tmp/helmfile /usr/local/bin/helmfile
          fi
          if ! helm plugin list | grep -q diff; then
            helm plugin install https://github.com/databus23/helm-diff
          fi

      - name: Verify cluster access
        run: kubectl get nodes -o wide

      - name: Ensure K8s secrets exist
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          kubectl create namespace helvex-prod --dry-run=client -o yaml | kubectl apply -f -

          # Always apply (update) the env secret so changes to GitHub Secrets
          # propagate to the cluster (SMTP creds, keys, etc.).
          kubectl create secret generic helvex-env \
            --from-literal=APP_ENV="prod" \
            --from-literal=DATABASE_URL="${{ secrets.DB_URL }}" \
            --from-literal=SERPER_API_KEY="${{ secrets.SERPER_API_KEY }}" \
            --from-literal=ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}" \
            --from-literal=ZEFIX_API_USERNAME="${{ secrets.ZEFIX_API_USERNAME }}" \
            --from-literal=ZEFIX_API_PASSWORD="${{ secrets.ZEFIX_API_PASSWORD }}" \
            --from-literal=GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
            --from-literal=GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
            --from-literal=LINKEDIN_CLIENT_ID="${{ secrets.LINKEDIN_CLIENT_ID }}" \
            --from-literal=LINKEDIN_CLIENT_SECRET="${{ secrets.LINKEDIN_CLIENT_SECRET }}" \
            --from-literal=PAYMENT_PROVIDER_MODE="${{ secrets.PAYMENT_PROVIDER_MODE }}" \
            --from-literal=WORLDLINE_API_BASE_URL="${{ secrets.WORLDLINE_API_BASE_URL }}" \
            --from-literal=WORLDLINE_CUSTOMER_ID="${{ secrets.WORLDLINE_CUSTOMER_ID }}" \
            --from-literal=WORLDLINE_TERMINAL_ID="${{ secrets.WORLDLINE_TERMINAL_ID }}" \
            --from-literal=WORLDLINE_API_USERNAME="${{ secrets.WORLDLINE_API_USERNAME }}" \
            --from-literal=WORLDLINE_API_PASSWORD="${{ secrets.WORLDLINE_API_PASSWORD }}" \
            --from-literal=WORLDLINE_RAW_API_LOGGING_ENABLED="${{ secrets.WORLDLINE_RAW_API_LOGGING_ENABLED }}" \
            --from-literal=SECRET_KEY="${{ secrets.SECRET_KEY }}" \
            --from-literal=S3_ACCESS_KEY="${{ secrets.S3_ACCESS_KEY }}" \
            --from-literal=S3_SECRET_KEY="${{ secrets.S3_SECRET_KEY }}" \
            --from-literal=S3_ENDPOINT_URL="${{ secrets.S3_ENDPOINT_URL }}" \
            --from-literal=S3_BUCKET_EXPORTS="${{ secrets.S3_BUCKET_EXPORTS }}" \
            --from-literal=S3_BUCKET_MODELS="${{ secrets.S3_BUCKET_MODELS }}" \
            --from-literal=S3_BUCKET_CRAWL="${{ secrets.S3_BUCKET_CRAWL }}" \
            --from-literal=SCRAPINGDOG_API_KEY="${{ secrets.SCRAPINGDOG_API_KEY }}" \
            --from-literal=SMTP_HOST="${{ secrets.SMTP_HOST }}" \
            --from-literal=SMTP_PORT="${{ secrets.SMTP_PORT }}" \
            --from-literal=SMTP_USER="${{ secrets.SMTP_USER }}" \
            --from-literal=SMTP_PASSWORD="${{ secrets.SMTP_PASSWORD }}" \
            --from-literal=SMTP_FROM="${{ secrets.SMTP_FROM }}" \
            --from-literal=STORAGEBOX_HOST="${{ secrets.STORAGEBOX_HOST }}" \
            --from-literal=STORAGEBOX_USER="${{ secrets.STORAGEBOX_USER }}" \
            --from-literal=STORAGEBOX_PATH="${{ secrets.STORAGEBOX_PATH }}" \
            --from-literal=STORAGEBOX_PORT="${{ secrets.STORAGEBOX_PORT }}" \
            --from-literal=STORAGEBOX_SSH_PRIVATE_KEY="${{ secrets.STORAGEBOX_SSH_PRIVATE_KEY }}" \
            --from-literal=APP_BASE_URL="https://helvex.dicy.ch" \
            --from-literal=username="helvex" \
            --from-literal=password="${{ secrets.DB_PASSWORD }}" \
            -n helvex-prod \
            --dry-run=client -o yaml | kubectl apply -f -
          if ! kubectl get secret ghcr-pull-secret -n helvex-prod &>/dev/null; then
            if [ -z "$GHCR_PAT" ]; then
              echo "ERROR: GHCR_PAT secret is not set in GitHub repo settings" >&2
              exit 1
            fi
            kubectl create secret docker-registry ghcr-pull-secret \
              --docker-server=ghcr.io \
              --docker-username="$REGISTRY_USER" \
              --docker-password="$GHCR_PAT" \
              -n helvex-prod
          fi
          if ! kubectl get secret arc-github-app -n arc-systems &>/dev/null; then
            kubectl create namespace arc-systems --dry-run=client -o yaml | kubectl apply -f -
            kubectl create secret generic arc-github-app \
              --from-literal=github_app_id="${{ secrets.ARC_APP_ID }}" \
              --from-literal=github_app_installation_id="${{ secrets.ARC_APP_INSTALLATION_ID }}" \
              --from-literal=github_app_private_key="${{ secrets.ARC_APP_PRIVATE_KEY }}" \
              -n arc-systems
          fi

      - name: Bootstrap CRDs (cert-manager + CloudNativePG)
        if: |
          (github.event_name != 'workflow_dispatch' && contains(github.event.head_commit.message, '[deploy-prod]')) ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_mode == 'prod')
        working-directory: infra
        run: |
          helmfile -e prod apply --selector name=cert-manager --suppress-diff
          helmfile -e prod apply --selector name=cloudnative-pg --suppress-diff
          kubectl wait --for condition=established --timeout=60s crd/clusters.postgresql.cnpg.io
          kubectl wait --for condition=established --timeout=60s crd/clusterissuers.cert-manager.io

      - name: Resolve backup server names
        if: |
          (github.event_name != 'workflow_dispatch' && (
            contains(github.event.head_commit.message, '[deploy-prod]')
          )) ||
          (github.event_name == 'workflow_dispatch' && (
            github.event.inputs.deploy_mode == 'prod'
          ))
        id: pg-meta
        env:
          MANUAL_RESTORE_SOURCE: ${{ github.event.inputs.restore_source || '' }}
          POSTGRES_RESTORE_SOURCE: ${{ vars.POSTGRES_RESTORE_SOURCE }}
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT_URL || secrets.S3_ENDPOINT_URL || 'https://nbg1.your-objectstorage.com' }}
          S3_BACKUP_PREFIX: s3://helvex-backups/pg-prod/
        run: |
          set -euo pipefail

          # --- backupServerName (where the NEW cluster writes backups) ---
          # Reuse from ConfigMap if it exists, otherwise generate a unique name.
          EXISTING=$(kubectl get configmap pg-backup-meta -n helvex-prod \
            -o jsonpath='{.data.serverName}' 2>/dev/null || echo "")

          if [ -n "$EXISTING" ]; then
            echo "Reusing existing backupServerName: $EXISTING"
            SERVER_NAME="$EXISTING"
            echo "server_name=$EXISTING" >> "$GITHUB_OUTPUT"
          else
            NEW_NAME="helvex-pg-$(date -u +%Y%m%dT%H%M%SZ)"
            echo "Generated new backupServerName: $NEW_NAME"
            SERVER_NAME="$NEW_NAME"
            kubectl create configmap pg-backup-meta \
              -n helvex-prod \
              --from-literal=serverName="$NEW_NAME" \
              --dry-run=client -o yaml | kubectl apply -f -
            echo "server_name=$NEW_NAME" >> "$GITHUB_OUTPUT"
          fi

          # --- restoreSourceServerName (where to restore FROM) ---
          # IMPORTANT: This is the server name where the *existing* backups live in S3.
          # In this repo it is typically a timestamped name like: helvex-pg-YYYYmmddTHHMMSSZ.
          # Selection order:
          # 1) Manual override (workflow_dispatch input restore_source)
          # 2) S3 restore-point file (restore-point.json)
          # 3) Repository file restore-point.json (tracked in git)
          # 4) Repo variable POSTGRES_RESTORE_SOURCE
          # 5) Existing ConfigMap value pg-backup-meta.data.restoreSource
          # 6) Default: 'helvex-pg'

          install_awscli() {
            if command -v aws >/dev/null 2>&1; then
              return 0
            fi

            echo "awscli not found; installing from official AWS CLI v2 bundle"

            if command -v sudo >/dev/null 2>&1; then
              sudo apt-get update -y
              sudo apt-get install -y curl unzip
            else
              apt-get update -y
              apt-get install -y curl unzip
            fi

            arch=$(uname -m)
            case "$arch" in
              x86_64) aws_arch="x86_64" ;;
              aarch64|arm64) aws_arch="aarch64" ;;
              *)
                echo "ERROR: unsupported architecture for AWS CLI bundle: $arch" >&2
                exit 1
                ;;
            esac

            tmpdir=$(mktemp -d)
            trap 'rm -rf "$tmpdir"' EXIT
            curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-${aws_arch}.zip" -o "$tmpdir/awscliv2.zip"
            (cd "$tmpdir" && unzip -q awscliv2.zip)

            if command -v sudo >/dev/null 2>&1; then
              sudo "$tmpdir/aws/install" --update
            else
              "$tmpdir/aws/install" --update
            fi

            if ! command -v aws >/dev/null 2>&1; then
              echo "ERROR: awscli installation failed" >&2
              exit 1
            fi
          }

          POINTER_URI="${S3_BACKUP_PREFIX}restore-point.json"
          POINTER_SOURCE=""
          RESTORE_SOURCE=""
          RESTORE_SOURCE_ORIGIN=""

          # Allow either the historic stable name (helvex-pg) or the common timestamped name.
          # Keep this intentionally strict (no slashes/spaces) since it will be used in S3 paths.
          is_valid_restore_source() {
            local s="$1"
            echo "$s" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9-]*[A-Za-z0-9]$'
          }

          install_awscli
          aws --version

          # Manual override should always win (one-off recovery).
          if [ -n "${MANUAL_RESTORE_SOURCE:-}" ]; then
            RESTORE_SOURCE="$MANUAL_RESTORE_SOURCE"
            RESTORE_SOURCE_ORIGIN="workflow_input"
            echo "Using manual restore source from workflow input: $RESTORE_SOURCE"
          fi

          if [ -z "$RESTORE_SOURCE" ]; then
            pointer_tmp=$(mktemp)
            if aws s3 cp "$POINTER_URI" "$pointer_tmp" --endpoint-url "$S3_ENDPOINT" >/dev/null 2>&1; then
              POINTER_SOURCE=$(python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(d.get('restoreSource',''))" "$pointer_tmp" 2>/dev/null || true)
              if [ -n "$POINTER_SOURCE" ]; then
                if is_valid_restore_source "$POINTER_SOURCE"; then
                  echo "Using restore source from pointer file: $POINTER_SOURCE"
                  RESTORE_SOURCE="$POINTER_SOURCE"
                  RESTORE_SOURCE_ORIGIN="s3_restore_point"
                else
                  echo "WARNING: pointer file restoreSource is invalid; ignoring: $POINTER_SOURCE" >&2
                fi
              else
                echo "Pointer file found but restoreSource is empty; falling back"
              fi
            else
              echo "No restore-point file found at ${POINTER_URI}; falling back"
            fi
            rm -f "$pointer_tmp"
          fi

          if [ -z "$RESTORE_SOURCE" ] && [ -f "restore-point.json" ]; then
            FILE_SOURCE=$(python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(d.get('restoreSource',''))" "restore-point.json" 2>/dev/null || true)
            if [ -n "$FILE_SOURCE" ]; then
              RESTORE_SOURCE="$FILE_SOURCE"
              RESTORE_SOURCE_ORIGIN="repo_file"
              echo "Using restore source from repository file restore-point.json: $RESTORE_SOURCE"
            else
              echo "Repository restore-point.json exists but restoreSource is empty"
            fi
          fi

          if [ -z "$RESTORE_SOURCE" ] && [ -n "${POSTGRES_RESTORE_SOURCE:-}" ]; then
            RESTORE_SOURCE="$POSTGRES_RESTORE_SOURCE"
            RESTORE_SOURCE_ORIGIN="repo_variable"
            echo "Using restore source from repo variable: $RESTORE_SOURCE"
          fi

          if [ -z "$RESTORE_SOURCE" ]; then
            RESTORE_SOURCE=$(kubectl get configmap pg-backup-meta -n helvex-prod \
              -o jsonpath='{.data.restoreSource}' 2>/dev/null || echo "")
            if [ -n "$RESTORE_SOURCE" ]; then
              RESTORE_SOURCE_ORIGIN="configmap"
              echo "Reusing restore source from ConfigMap: $RESTORE_SOURCE"
            fi
          fi

          if [ -z "$RESTORE_SOURCE" ]; then
            echo "WARNING: restore source not explicitly set; defaulting to stable server name 'helvex-pg'" >&2
            RESTORE_SOURCE="helvex-pg"
            RESTORE_SOURCE_ORIGIN="default_stable_name"
          fi

          if ! is_valid_restore_source "$RESTORE_SOURCE"; then
            echo "ERROR: invalid restore source format: $RESTORE_SOURCE" >&2
            echo "Expected: letters/digits/hyphens only (e.g., 'helvex-pg' or 'helvex-pg-20260404T042945Z')" >&2
            exit 1
          fi

          kubectl create configmap pg-backup-meta \
            -n helvex-prod \
            --from-literal=serverName="$SERVER_NAME" \
            --from-literal=restoreSource="$RESTORE_SOURCE" \
            --dry-run=client -o yaml | kubectl apply -f -

          # Write/update restore-point file in S3 so future restores can resolve
          # without S3 prefix scanning.
          pointer_write_tmp=$(mktemp)
          printf '{"restoreSource":"%s","backupServerName":"%s","updatedAt":"%s","backupPrefix":"%s"}\n' \
            "$RESTORE_SOURCE" \
            "$SERVER_NAME" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "$S3_BACKUP_PREFIX" > "$pointer_write_tmp"
          aws s3 cp "$pointer_write_tmp" "$POINTER_URI" --endpoint-url "$S3_ENDPOINT"
          rm -f "$pointer_write_tmp"

          echo "restore_source=$RESTORE_SOURCE" >> "$GITHUB_OUTPUT"
          echo "restore_source_origin=${RESTORE_SOURCE_ORIGIN:-unknown}" >> "$GITHUB_OUTPUT"
          echo "Will restore from backup prefix: ${RESTORE_SOURCE}"

      - name: Preflight restore summary
        if: |
          (github.event_name != 'workflow_dispatch' && (
            contains(github.event.head_commit.message, '[deploy-prod]')
          )) ||
          (github.event_name == 'workflow_dispatch' && (
            github.event.inputs.deploy_mode == 'prod'
          ))
        run: |
          echo "Restore source preflight"
          echo "  Restoring FROM server: ${{ steps.pg-meta.outputs.restore_source }}"
          echo "  New cluster server name: ${{ steps.pg-meta.outputs.server_name }}"
          echo "  Restore source origin: ${{ steps.pg-meta.outputs.restore_source_origin }}"

          {
            echo "## Restore Source Preflight"
            echo "- restore_from_server_name: \`${{ steps.pg-meta.outputs.restore_source }}\` (backups in S3)"
            echo "- new_backup_server_name: \`${{ steps.pg-meta.outputs.server_name }}\` (new cluster's backups)"
            echo "- origin: \`${{ steps.pg-meta.outputs.restore_source_origin }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply Helmfile (full deploy)
        if: |
          (github.event_name != 'workflow_dispatch' && (
            contains(github.event.head_commit.message, '[deploy-prod]')
          )) ||
          (github.event_name == 'workflow_dispatch' && (
            github.event.inputs.deploy_mode == 'prod'
          ))
        working-directory: infra
        run: |
          helmfile -e prod apply \
            --set "image.tag=${{ github.sha }}" \
            --set "mlImage.tag=${{ github.sha }}" \
            --set "frontend.image.tag=${{ github.sha }}" \
            --set "postgres.backupServerName=${{ steps.pg-meta.outputs.server_name }}" \
            --set "postgres.restoreSourceServerName=${{ steps.pg-meta.outputs.restore_source }}" \
            --suppress-diff

      - name: Deploy app (backend + frontend + api-worker)
        if: |
          (github.event_name != 'workflow_dispatch' && contains(github.event.head_commit.message, '[deploy-app]')) ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_mode == 'app')
        run: |
          kubectl set image deployment/helvex \
            app=ghcr.io/${{ github.repository }}:${{ github.sha }} \
            -n helvex-prod
          kubectl set image deployment/helvex-api-worker \
            api-worker=ghcr.io/${{ github.repository }}:${{ github.sha }} \
            -n helvex-prod
          kubectl set image deployment/helvex-frontend \
            frontend=ghcr.io/${{ github.repository }}-frontend:${{ github.sha }} \
            -n helvex-prod

      - name: Deploy all app images (backend + frontend + api-worker + ml-worker)
        if: |
          (github.event_name != 'workflow_dispatch' && contains(github.event.head_commit.message, '[deploy-all]')) ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_mode == 'all')
        working-directory: infra
        run: |
          helmfile -e prod apply --selector name=helvex \
            --set "image.tag=${{ github.sha }}" \
            --set "mlImage.tag=${{ github.sha }}" \
            --set "frontend.image.tag=${{ github.sha }}" \
            --suppress-diff

      - name: Deploy frontend only
        if: |
          (github.event_name != 'workflow_dispatch' && contains(github.event.head_commit.message, '[deploy-frontend]')) ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_mode == 'frontend')
        run: |
          kubectl set image deployment/helvex-frontend \
            frontend=ghcr.io/${{ github.repository }}-frontend:${{ github.sha }} \
            -n helvex-prod

      - name: Deploy backend only
        if: |
          (github.event_name != 'workflow_dispatch' && contains(github.event.head_commit.message, '[deploy-backend]')) ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_mode == 'backend')
        run: |
          kubectl set image deployment/helvex \
            app=ghcr.io/${{ github.repository }}:${{ github.sha }} \
            -n helvex-prod
          kubectl set image deployment/helvex-api-worker \
            api-worker=ghcr.io/${{ github.repository }}:${{ github.sha }} \
            -n helvex-prod

      - name: Deploy ml worker only
        if: |
          (github.event_name != 'workflow_dispatch' && contains(github.event.head_commit.message, '[deploy-ml]')) ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_mode == 'ml')
        run: |
          kubectl set image deployment/helvex-ml-worker \
            ml-worker=ghcr.io/${{ github.repository }}-ml:${{ github.sha }} \
            -n helvex-prod
          ML_WHITELIST=$(grep -A1 'name: JOB_TYPE_WHITELIST' \
            ../infra/charts/helvex/templates/ml-worker-deployment.yaml \
            | grep 'value:' | sed 's/.*value: *"//;s/"$//')
          kubectl set env deployment/helvex-ml-worker -n helvex-prod \
            "JOB_TYPE_WHITELIST=${ML_WHITELIST}"

      - name: Deploy crawler-http only
        if: |
          (github.event_name != 'workflow_dispatch' && contains(github.event.head_commit.message, '[deploy-http]')) ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_mode == 'http')
        run: |
          kubectl set image deployment/helvex-crawler-http \
            crawler-http=ghcr.io/${{ github.repository }}:${{ github.sha }} \
            -n helvex-prod

      - name: Wait for PostgreSQL to be healthy
        if: |
          (github.event_name != 'workflow_dispatch' && contains(github.event.head_commit.message, '[deploy-prod]')) ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_mode == 'prod')
        run: |
          echo "Waiting for PostgreSQL cluster to become healthy..."
          for i in $(seq 1 60); do
            phase=$(kubectl get cluster helvex-pg -n helvex-prod -o jsonpath='{.status.phase}' 2>/dev/null || echo "NotFound")
            echo "  Attempt $i/60: phase=$phase"
            if [ "$phase" = "Cluster in healthy state" ]; then
              echo "PostgreSQL is healthy!"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "ERROR: PostgreSQL did not become healthy within 10 minutes"
              kubectl describe cluster helvex-pg -n helvex-prod || true
              kubectl get pods -n helvex-prod -l cnpg.io/cluster=helvex-pg -o wide || true
              kubectl logs -n helvex-prod -l cnpg.io/cluster=helvex-pg --tail=50 || true
              exit 1
            fi
            sleep 10
          done

      - name: Wait for rollout
        env:
          DEPLOY_MODE: ${{ github.event.inputs.deploy_mode }}
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ "${DEPLOY_MODE}" = "frontend" ]; then
              kubectl rollout status deployment/helvex-frontend -n helvex-prod --timeout=180s
            elif [ "${DEPLOY_MODE}" = "backend" ]; then
              kubectl rollout status deployment/helvex -n helvex-prod --timeout=360s
            elif [ "${DEPLOY_MODE}" = "ml" ]; then
              kubectl rollout status deployment/helvex-ml-worker -n helvex-prod --timeout=360s
            elif [ "${DEPLOY_MODE}" = "app" ]; then
              kubectl rollout status deployment/helvex -n helvex-prod --timeout=360s
              kubectl rollout status deployment/helvex-api-worker -n helvex-prod --timeout=360s
              kubectl rollout status deployment/helvex-frontend -n helvex-prod --timeout=180s
            else
              kubectl rollout status deployment/helvex -n helvex-prod --timeout=360s
              kubectl rollout status deployment/helvex-ml-worker -n helvex-prod --timeout=360s
              kubectl rollout status deployment/helvex-frontend -n helvex-prod --timeout=180s
            fi
          elif echo "$COMMIT_MSG" | grep -qF '[deploy-frontend]'; then
            kubectl rollout status deployment/helvex-frontend -n helvex-prod --timeout=180s
          elif echo "$COMMIT_MSG" | grep -qF '[deploy-backend]'; then
            kubectl rollout status deployment/helvex -n helvex-prod --timeout=360s
          elif echo "$COMMIT_MSG" | grep -qF '[deploy-ml]'; then
            kubectl rollout status deployment/helvex-ml-worker -n helvex-prod --timeout=360s
          elif echo "$COMMIT_MSG" | grep -qF '[deploy-http]'; then
            kubectl rollout status deployment/helvex-crawler-http -n helvex-prod --timeout=360s
          elif echo "$COMMIT_MSG" | grep -qF '[deploy-app]'; then
            kubectl rollout status deployment/helvex -n helvex-prod --timeout=360s
            kubectl rollout status deployment/helvex-api-worker -n helvex-prod --timeout=360s
            kubectl rollout status deployment/helvex-frontend -n helvex-prod --timeout=180s
          else
            kubectl rollout status deployment/helvex -n helvex-prod --timeout=360s
            kubectl rollout status deployment/helvex-ml-worker -n helvex-prod --timeout=360s
            kubectl rollout status deployment/helvex-frontend -n helvex-prod --timeout=180s
          fi

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          echo "=== Pods ==="
          kubectl get pods -n helvex-prod -o wide
          echo "=== Helvex pod describe ==="
          kubectl describe pods -n helvex-prod -l app.kubernetes.io/name=helvex
          echo "=== Helvex logs (current) ==="
          kubectl logs -n helvex-prod -l app.kubernetes.io/name=helvex --tail=80 || true
          echo "=== Helvex logs (previous, if crash-looped) ==="
          kubectl logs -n helvex-prod -l app.kubernetes.io/name=helvex --previous --tail=80 || true
          echo "=== Events ==="
          kubectl get events -n helvex-prod --sort-by='.lastTimestamp' | tail -30

      - name: Bump patch version
        if: |
          (github.event_name != 'workflow_dispatch' && (
            contains(github.event.head_commit.message, '[deploy-frontend]') ||
            contains(github.event.head_commit.message, '[deploy-backend]') ||
            contains(github.event.head_commit.message, '[deploy-ml]')
          )) ||
          (github.event_name == 'workflow_dispatch' && (
            github.event.inputs.deploy_mode == 'frontend' ||
            github.event.inputs.deploy_mode == 'backend' ||
            github.event.inputs.deploy_mode == 'ml'
          ))
        run: |
          latest=$(git tag --list 'v*.*.*' --sort=-version:refname | head -1)
          latest=${latest:-v0.0.0}
          major=$(echo "$latest" | cut -d. -f1 | tr -d 'v')
          minor=$(echo "$latest" | cut -d. -f2)
          patch=$(echo "$latest" | cut -d. -f3)
          new_tag="v${major}.${minor}.$((patch + 1))"
          echo "Bumping $latest → $new_tag"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$new_tag" -m "Release $new_tag"
          git push origin "$new_tag"

      - name: Bump minor version
        if: |
          contains(github.event.head_commit.message, '[deploy-prod]') ||
          contains(github.event.head_commit.message, '[deploy-app]') ||
          contains(github.event.head_commit.message, '[deploy-all]')
        run: |
          latest=$(git tag --list 'v*.*.*' --sort=-version:refname | head -1)
          latest=${latest:-v0.0.0}
          major=$(echo "$latest" | cut -d. -f1 | tr -d 'v')
          minor=$(echo "$latest" | cut -d. -f2)
          new_tag="v${major}.$((minor + 1)).0"
          echo "Bumping $latest → $new_tag"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$new_tag" -m "Release $new_tag"
          git push origin "$new_tag"
