name: Deploy Dev

on:
  push:
    branches: ['**']

jobs:
  changes:
    if: contains(github.event.head_commit.message, '[deploy-dev]')
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      ml: ${{ steps.filter.outputs.ml }}
    steps:
      - uses: actions/checkout@v5

      - name: Detect changed areas
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'app/**'
              - 'alembic/**'
              - 'requirements.txt'
              - 'requirements.backend.txt'
              - 'requirements.ml.txt'
              - 'pyproject.toml'
              - 'Dockerfile'
              - 'entrypoint.sh'
            frontend:
              - 'frontend/**'
            ml:
              - 'app/services/cluster_pipeline.py'
              - 'app/services/noga.py'
              - 'app/services/job_worker.py'
              - 'scripts/build_noga_embeddings.py'
              - 'noga_lookup.json'
              - 'noga_tree.json'
              - 'requirements.txt'
              - 'requirements.backend.txt'
              - 'requirements.ml.txt'
              - 'Dockerfile.ml'
              - 'Dockerfile.ml-base'

  # ── Parallel build jobs ───────────────────────────────────────────────────
  build-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      USE_QEMU: ${{ vars.BUILD_QEMU_BACKEND == 'true' }}
      BUILD_PLATFORMS: ${{ vars.BUILD_QEMU_BACKEND == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        if: env.USE_QEMU == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          platforms: ${{ env.BUILD_PLATFORMS }}
          build-args: |
            INSTALL_SPACY_MODEL=false
            BUILD_GEOCODING_DB=false
          tags: |
            ghcr.io/${{ github.repository }}:dev
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-ml:
    # Dev ml build uses Dockerfile.ml which pulls ml-base:latest from GHCR.
    # ml-base:latest is maintained by prod deploys — no heavy rebuild needed here.
    needs: changes
    if: needs.changes.outputs.ml == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      USE_QEMU: ${{ vars.BUILD_QEMU_ML_BASE == 'true' || vars.BUILD_QEMU_ML == 'true' }}
      BUILD_PLATFORMS: ${{ (vars.BUILD_QEMU_ML_BASE == 'true' || vars.BUILD_QEMU_ML == 'true') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        if: env.USE_QEMU == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Build and push ml worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ml
          push: true
          provenance: false
          platforms: ${{ env.BUILD_PLATFORMS }}
          tags: |
            ghcr.io/${{ github.repository }}-ml:dev
            ghcr.io/${{ github.repository }}-ml:${{ github.sha }}
          build-args: |
            ML_BASE_IMAGE=ghcr.io/${{ github.repository }}-ml-base:latest
          cache-from: type=gha,scope=ml-worker
          cache-to: type=gha,mode=max,scope=ml-worker

  build-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      USE_QEMU: ${{ vars.BUILD_QEMU_FRONTEND == 'true' }}
      BUILD_PLATFORMS: ${{ vars.BUILD_QEMU_FRONTEND == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        if: env.USE_QEMU == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          provenance: false
          platforms: ${{ env.BUILD_PLATFORMS }}
          tags: |
            ghcr.io/${{ github.repository }}-frontend:dev
            ghcr.io/${{ github.repository }}-frontend:${{ github.sha }}
          build-args: |
            FASTAPI_URL=http://helvex:8000
            NEXT_PUBLIC_GTM_ID=${{ secrets.NEXT_PUBLIC_GTM_ID }}
            NEXT_PUBLIC_ADSENSE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_ADSENSE_CLIENT_ID }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
            NEXT_PUBLIC_UMAMI_WEBSITE_ID=${{ secrets.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
            NEXT_PUBLIC_UMAMI_SCRIPT_URL=${{ secrets.NEXT_PUBLIC_UMAMI_SCRIPT_URL }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ── Deploy ────────────────────────────────────────────────────────────────
  deploy:
    needs: [build-backend, build-ml, build-frontend]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      contains(github.event.head_commit.message, '[deploy-dev]')
    runs-on: helvex-dev
    steps:
      - uses: actions/checkout@v5

      - name: Prepare kubeconfig
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kube"
          if [ -r /etc/rancher/k3s/k3s.yaml ]; then
            cp /etc/rancher/k3s/k3s.yaml "$HOME/.kube/config"
            chmod 600 "$HOME/.kube/config"
          else
            echo "ERROR: Runner user cannot read /etc/rancher/k3s/k3s.yaml" >&2
            echo "Run: sudo usermod -aG k3s <runner-user>" >&2
            exit 1
          fi
          echo "KUBECONFIG=$HOME/.kube/config" >> "$GITHUB_ENV"

      - name: Verify cluster access
        run: kubectl get nodes -o wide

      - name: Ensure K8s secrets exist
        run: |
          kubectl create namespace helvex-dev --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic helvex-env \
            --from-literal=DATABASE_URL="${{ secrets.DB_URL }}" \
            --from-literal=REDIS_URL="${{ secrets.REDIS_URL }}" \
            --from-literal=REDIS_PASSWORD="${{ secrets.REDIS_PASSWORD }}" \
            --from-literal=SERPER_API_KEY="${{ secrets.SERPER_API_KEY }}" \
            --from-literal=ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}" \
            --from-literal=ZEFIX_API_USERNAME="${{ secrets.ZEFIX_API_USERNAME }}" \
            --from-literal=ZEFIX_API_PASSWORD="${{ secrets.ZEFIX_API_PASSWORD }}" \
            --from-literal=SECRET_KEY="${{ secrets.SECRET_KEY }}" \
            --from-literal=S3_ACCESS_KEY="${{ secrets.S3_ACCESS_KEY }}" \
            --from-literal=S3_SECRET_KEY="${{ secrets.S3_SECRET_KEY }}" \
            --from-literal=STORAGEBOX_HOST="${{ secrets.STORAGEBOX_HOST }}" \
            --from-literal=STORAGEBOX_USER="${{ secrets.STORAGEBOX_USER }}" \
            --from-literal=STORAGEBOX_PATH="${{ secrets.STORAGEBOX_PATH }}" \
            --from-literal=STORAGEBOX_PORT="${{ secrets.STORAGEBOX_PORT }}" \
            --from-literal=STORAGEBOX_SSH_PRIVATE_KEY="${{ secrets.STORAGEBOX_SSH_PRIVATE_KEY }}" \
            --from-literal=GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
            --from-literal=GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
            --from-literal=LINKEDIN_CLIENT_ID="${{ secrets.LINKEDIN_CLIENT_ID }}" \
            --from-literal=LINKEDIN_CLIENT_SECRET="${{ secrets.LINKEDIN_CLIENT_SECRET }}" \
            --from-literal=PAYMENT_PROVIDER_MODE="${{ secrets.PAYMENT_PROVIDER_MODE }}" \
            --from-literal=WORLDLINE_API_BASE_URL="${{ secrets.WORLDLINE_API_BASE_URL }}" \
            --from-literal=WORLDLINE_CUSTOMER_ID="${{ secrets.WORLDLINE_CUSTOMER_ID }}" \
            --from-literal=WORLDLINE_TERMINAL_ID="${{ secrets.WORLDLINE_TERMINAL_ID }}" \
            --from-literal=WORLDLINE_API_USERNAME="${{ secrets.WORLDLINE_API_USERNAME }}" \
            --from-literal=WORLDLINE_API_PASSWORD="${{ secrets.WORLDLINE_API_PASSWORD }}" \
            --from-literal=username="helvex" \
            --from-literal=password="${{ secrets.DB_PASSWORD }}" \
            -n helvex-dev \
            --dry-run=client -o yaml | kubectl apply -f -
          if ! kubectl get secret ghcr-pull-secret -n helvex-dev &>/dev/null; then
            kubectl create secret docker-registry ghcr-pull-secret \
              --docker-server=ghcr.io \
              --docker-username=${{ github.actor }} \
              --docker-password=${{ secrets.GHCR_PAT }} \
              -n helvex-dev
          fi

      - name: Bootstrap CRDs (cert-manager + CloudNativePG)
        working-directory: infra
        run: |
          helmfile -e dev apply --selector name=cert-manager --suppress-diff
          helmfile -e dev apply --selector name=cloudnative-pg --suppress-diff
          kubectl wait --for condition=established --timeout=60s crd/clusters.postgresql.cnpg.io
          kubectl wait --for condition=established --timeout=60s crd/clusterissuers.cert-manager.io

      - name: Apply Helmfile (dev)
        working-directory: infra
        run: |
          helmfile -e dev apply \
            --set "image.tag=dev" \
            --set "mlImage.tag=dev" \
            --set "frontend.image.tag=dev" \
            --suppress-diff

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/helvex -n helvex-dev --timeout=120s
          kubectl rollout status deployment/helvex-frontend -n helvex-dev --timeout=120s
