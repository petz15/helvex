{{- if .Values.apiWorker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helvex.fullname" . }}-api-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helvex.labels" . | nindent 4 }}
    app.kubernetes.io/component: api-worker
spec:
  replicas: {{ .Values.apiWorker.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "helvex.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api-worker
  template:
    metadata:
      labels:
        {{- include "helvex.labels" . | nindent 8 }}
        app.kubernetes.io/component: api-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      automountServiceAccountToken: false
      # Job workers pause in-flight jobs at their next checkpoint on SIGTERM
      # (job_worker.request_shutdown waits up to JOB_SHUTDOWN_JOIN_TIMEOUT,
      # default 25s). The K8s default of 30s leaves no margin for that, so
      # give the drain room before the SIGKILL.
      terminationGracePeriodSeconds: 60
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api-worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: JOB_TYPE_WHITELIST
              value: "bulk,detail,initial,uid_import,uid_detail,simap_daily,simap_backfill,simap_archive,shab_daily,shab_backfill,shab_archive,link_sogc_stubs,resolve_shab_old_uids,backfill_shab_old_uid_extraction,sogc_preprocess,extract_sogc_persons,resolve_bisher_links,repair_is_current,web_search_batch,re_geocode,recalculate_scores,recalculate_google_scores,recompute_website_status,reextract_purpose,reextract_zefix_raw,claude_classify,csv_export,analyze_boilerplate,billing_renewal,saved_view_alerts,discover_directory_domains,rescore_scope"
            - name: JOB_WORKER_CONCURRENCY
              value: "{{ .Values.apiWorker.concurrency }}"
            {{- if .Values.mlWorker.enabled }}
            - name: ML_WORKER_INTERNAL_URL
              value: "http://{{ include "helvex.fullname" . }}-ml-worker:8000"
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ .Values.envSecretName }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.apiWorker.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
