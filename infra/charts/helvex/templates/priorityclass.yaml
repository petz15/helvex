apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: helvex-web
  labels:
    {{- include "helvex.labels" . | nindent 4 }}
value: 1000
globalDefault: false
description: "Web-facing pods (app, frontend). Evicted last."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: helvex-worker
  labels:
    {{- include "helvex.labels" . | nindent 4 }}
value: 100
globalDefault: false
description: "Background job workers (zefix, api). Evicted before web pods under memory pressure."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: helvex-ml-worker
  labels:
    {{- include "helvex.labels" . | nindent 4 }}
value: 50
globalDefault: false
description: "ML worker (HDBSCAN/TF-IDF). Evicted first — spun up on demand via KEDA."
