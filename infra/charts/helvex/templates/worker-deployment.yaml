{{- if .Values.zefixWorker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helvex.fullname" . }}-zefix-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helvex.labels" . | nindent 4 }}
    app.kubernetes.io/component: zefix-worker
spec:
  replicas: {{ .Values.zefixWorker.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "helvex.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: zefix-worker
  template:
    metadata:
      labels:
        {{- include "helvex.labels" . | nindent 8 }}
        app.kubernetes.io/component: zefix-worker
    spec:
      # Allow enough time for the running job to reach its next checkpoint
      # and write status=paused before K8s sends SIGKILL.
      # The graceful-shutdown handler sets the _shutdown_requested flag on
      # SIGTERM; jobs pause within one progress tick (typically <30 s).
      terminationGracePeriodSeconds: 90
      priorityClassName: helvex-worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: zefix-worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "app.worker_entrypoint"]
          envFrom:
            - secretRef:
                name: {{ .Values.envSecretName }}
          env:
            - name: USE_RQ
              value: "true"
            - name: DISABLE_JOB_WORKER
              value: "true"
            - name: WORKER_TYPE
              value: "zefix"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
          resources:
            {{- toYaml .Values.zefixWorker.resources | nindent 12 }}
{{- end }}
