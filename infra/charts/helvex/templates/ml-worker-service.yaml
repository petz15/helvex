{{- if .Values.mlWorker.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "helvex.fullname" . }}-ml-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helvex.labels" . | nindent 4 }}
    app.kubernetes.io/component: ml-worker
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
  selector:
    {{- include "helvex.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ml-worker
{{- end }}
