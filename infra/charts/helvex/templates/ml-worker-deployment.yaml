{{- if .Values.mlWorker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helvex.fullname" . }}-ml-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helvex.labels" . | nindent 4 }}
    app.kubernetes.io/component: ml-worker
spec:
  # With KEDA enabled we start at 0 and let ScaledObject drive 0→1.
  # Without KEDA we keep one always-on ML worker.
  replicas: {{ ternary 0 (.Values.mlWorker.replicaCount | default 1) .Values.mlWorker.keda.enabled }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "helvex.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ml-worker
  template:
    metadata:
      labels:
        {{- include "helvex.labels" . | nindent 8 }}
        app.kubernetes.io/component: ml-worker
    spec:
      # Allow enough time for the running job to reach its next checkpoint
      # and write status=paused before K8s sends SIGKILL.
      terminationGracePeriodSeconds: 90
      priorityClassName: helvex-ml-worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mlWorker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mlWorker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ml-worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "app.worker_entrypoint"]
          envFrom:
            - secretRef:
                name: {{ .Values.envSecretName }}
          env:
            - name: USE_RQ
              value: "true"
            - name: DISABLE_JOB_WORKER
              value: "true"
            - name: WORKER_TYPE
              value: "ml"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
          resources:
            {{- toYaml .Values.mlWorker.resources | nindent 12 }}
{{- end }}
