{{- if .Values.mlWorker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helvex.fullname" . }}-ml-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helvex.labels" . | nindent 4 }}
    app.kubernetes.io/component: ml-worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "helvex.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ml-worker
  template:
    metadata:
      labels:
        {{- include "helvex.labels" . | nindent 8 }}
        app.kubernetes.io/component: ml-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mlWorker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mlWorker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ml-worker
          image: "{{ .Values.mlImage.repository }}:{{ .Values.mlImage.tag }}"
          imagePullPolicy: {{ .Values.mlImage.pullPolicy }}
          env:
            - name: JOB_TYPE_WHITELIST
              value: "reclassify_noga,build_noga_embeddings,detect_language_bulk,reclassify_low_conf_noga,tfidf_kmeans_cluster,recompute_keywords,reextract_keywords,cluster_analysis,discover_stopwords,noga_v2_explain,embed_purpose_full,embed_purpose_clean,strip_purpose_semantic,enrich_web_purpose_sim,web_crawl_http,web_crawl_playwright,web_extract"
          envFrom:
            - secretRef:
                name: {{ .Values.envSecretName }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.mlWorker.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
