{{- if .Values.postgres.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "helvex.fullname" . }}-pg
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helvex.labels" . | nindent 4 }}
spec:
  imageName: {{ .Values.postgres.imageName | default "ghcr.io/cloudnative-pg/postgresql:16.4" }}
  {{- if .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- range .Values.imagePullSecrets }}
    - name: {{ .name }}
    {{- end }}
  {{- end }}
  instances: {{ .Values.postgres.instances }}

  storage:
    size: {{ .Values.postgres.storageSize }}

  postgresql:
    parameters:
      wal_compression: "on"
      checkpoint_completion_target: "0.9"
    pg_hba:
      - host all all 0.0.0.0/0 scram-sha-256

  bootstrap:
    {{- if .Values.postgres.restoreFromBackup }}
    recovery:
      source: helvex-backup
    {{- else }}
    initdb:
      database: {{ .Values.postgres.database }}
      owner: {{ .Values.postgres.owner }}
      secret:
        name: {{ .Values.envSecretName }}
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector
    {{- end }}

  superuserSecret:
    name: {{ .Values.envSecretName }}

  {{- if and .Values.postgres.backupEnabled .Values.postgres.restoreFromBackup }}
  externalClusters:
    - name: helvex-backup
      barmanObjectStore:
        serverName: {{ .Values.postgres.restoreSourceServerName | default (printf "%s-pg" (include "helvex.fullname" .)) }}
        destinationPath: {{ .Values.postgres.s3BucketPath }}
        endpointURL: {{ .Values.postgres.s3EndpointUrl }}
        s3Credentials:
          accessKeyId:
            name: {{ .Values.envSecretName }}
            key: S3_ACCESS_KEY
          secretAccessKey:
            name: {{ .Values.envSecretName }}
            key: S3_SECRET_KEY
  {{- end }}

  {{- if .Values.postgres.backupEnabled }}
  backup:
    retentionPolicy: {{ .Values.postgres.backupRetention }}
    barmanObjectStore:
      {{- if .Values.postgres.backupServerName }}
      serverName: {{ .Values.postgres.backupServerName }}
      {{- end }}
      destinationPath: {{ .Values.postgres.s3BucketPath }}
      endpointURL: {{ .Values.postgres.s3EndpointUrl }}
      {{- if .Values.postgres.backupDataCompression }}
      data:
        compression: {{ .Values.postgres.backupDataCompression | quote }}
      {{- end }}
      {{- if .Values.postgres.backupWalCompression }}
      wal:
        compression: {{ .Values.postgres.backupWalCompression | quote }}
      {{- end }}
      s3Credentials:
        accessKeyId:
          name: {{ .Values.envSecretName }}
          key: S3_ACCESS_KEY
        secretAccessKey:
          name: {{ .Values.envSecretName }}
          key: S3_SECRET_KEY
  {{- end }}

  affinity:
    nodeSelector:
      helvex.io/role: database
    tolerations:
      - key: helvex.io/role
        operator: Equal
        value: database
        effect: NoSchedule
{{- end }}
