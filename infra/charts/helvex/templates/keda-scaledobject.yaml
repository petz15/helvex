{{- if and .Values.mlWorker.enabled .Values.mlWorker.keda.enabled }}
---
# TriggerAuthentication lets KEDA read the Redis password from the app secret.
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ include "helvex.fullname" . }}-redis-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helvex.labels" . | nindent 4 }}
spec:
  secretTargetRef:
    - parameter: password
      name: {{ .Values.envSecretName }}
      key: REDIS_PASSWORD
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "helvex.fullname" . }}-ml-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helvex.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    name: {{ include "helvex.fullname" . }}-ml-worker
  minReplicaCount: 0
  maxReplicaCount: 1
  # Keep the pod alive for 5 minutes after the queue empties to avoid
  # thrashing if multiple jobs are submitted in quick succession.
  cooldownPeriod: 300
  triggers:
    - type: redis
      authenticationRef:
        name: {{ include "helvex.fullname" . }}-redis-auth
      metadata:
        # RQ stores the queue as a Redis list: rq:queue:<name>
        # FQDN required because KEDA metrics adapter runs in the 'keda' namespace.
        address: {{ include "helvex.fullname" . }}-redis-master.{{ .Release.Namespace }}.svc.cluster.local:6379
        listName: rq:queue:helvex-ml
        listLength: "1"
{{- end }}
