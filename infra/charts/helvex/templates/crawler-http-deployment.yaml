{{- if .Values.crawlerHttpWorker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helvex.fullname" . }}-crawler-http
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helvex.labels" . | nindent 4 }}
    app.kubernetes.io/component: crawler-http
spec:
  replicas: {{ .Values.crawlerHttpWorker.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "helvex.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: crawler-http
  template:
    metadata:
      labels:
        {{- include "helvex.labels" . | nindent 8 }}
        app.kubernetes.io/component: crawler-http
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      automountServiceAccountToken: false
      # Job workers pause in-flight jobs at their next checkpoint on SIGTERM
      # (job_worker.request_shutdown waits up to JOB_SHUTDOWN_JOIN_TIMEOUT,
      # default 25s). The K8s default of 30s leaves no margin for that, so
      # give the drain room before the SIGKILL.
      terminationGracePeriodSeconds: 60
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: crawler-http
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            # web_extract belongs here, not only on the ML worker: it is pure
            # lxml/trafilatura/S3/DB work (all in requirements.backend.txt, and
            # spaCy NER degrades gracefully when the model is absent). Leaving it
            # ML-only put the identity-critical step — the one that turns crawled
            # HTML into a website verdict — behind NOGA and Chromium on that pod's
            # single slot, so a stuck browser crawl stalled the whole pipeline.
            # It is still dedup'd, so this relocates it rather than parallelising it.
            - name: JOB_TYPE_WHITELIST
              value: "web_crawl_http,web_crawl_content,web_crawl_external,web_extract,reopen_identity,web_url_populate,web_select_url,web_crawl_single,directory_crawl"
            # NOTE: multiplies with the in-job `crawl_concurrency` param — see
            # crawlerHttpWorker.concurrency in values.yaml before raising this.
            - name: JOB_WORKER_CONCURRENCY
              value: "{{ .Values.crawlerHttpWorker.concurrency }}"
          envFrom:
            - secretRef:
                name: {{ .Values.envSecretName }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.crawlerHttpWorker.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
