# Default values — overridden by infra/environments/{dev,prod}.yaml

image:
  repository: localhost:5000/helvex-app
  tag: latest
  pullPolicy: Always

replicaCount: 1

service:
  port: 8000

frontend:
  enabled: true
  image:
    repository: localhost:5000/helvex-frontend
    tag: latest
    pullPolicy: Always
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

ingress:
  enabled: true
  host: helvex.dicy.ch
  tls: false
  tlsSecret: ""
  annotations: {}

# Name of the K8s Secret that holds all env vars (created via Doppler operator or manually)
envSecretName: helvex-env

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

# GHCR pull secret — set in prod.yaml; leave empty for dev (local registry needs no auth)
imagePullSecrets: []

# ── RQ workers — separate Deployments running app/worker_entrypoint.py ─────────
#
# Three specialized workers:
#   zefix-worker  helvex-zefix-p4..p0  bulk/detail/initial imports
#   api-worker    helvex-api-p4..p0    scoring, geocode, NOGA, Claude classify
#   ml-worker     helvex-ml            HDBSCAN clustering, TF-IDF (scale-to-0 via KEDA)

zefixWorker:
  enabled: false   # set to true in prod
  replicaCount: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

apiWorker:
  enabled: false   # set to true in prod
  replicaCount: 2  # 2 replicas = 2 concurrent API jobs
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

mlWorker:
  enabled: false   # set to true in prod
  replicaCount: 1
  keda:
    enabled: false   # set to true after KEDA + Hetzner Cluster Autoscaler are installed
  # nodeSelector and tolerations for a dedicated ML node pool (set in prod.yaml after CA setup)
  nodeSelector: {}
  tolerations: []
  resources:
    requests:
      cpu: "4"
      memory: 8Gi
    limits:
      cpu: "6"
      memory: 16Gi

# CloudNativePG PostgreSQL cluster
postgres:
  enabled: false   # set to true in prod once CloudNativePG operator is installed
  instances: 2
  storageSize: 20Gi
  database: helvex
  owner: helvex
  backupEnabled: false
  restoreFromBackup: false   # set to true on rebuild to restore from S3 instead of initdb
  backupServerName: ""              # auto-generated by deploy workflow on fresh clusters; avoids WAL archive collision on restore
  restoreSourceServerName: ""       # auto-detected by deploy workflow; S3 subdirectory to restore from (default: <cluster-name>)
  s3EndpointUrl: ""    # e.g. https://fsn1.your-objectstorage.com
  s3BucketPath: ""     # e.g. s3://helvex-backups/pg/
  backupSchedule: "0 0 2 * * *"  # 6-field cron (sec min hour day month weekday) for CNPG ScheduledBackup
  backupRetention: "7d"
  backupPrune:
    enabled: false
    schedule: "0 4 * * 0"        # weekly Sunday 04:00 UTC
    retentionDays: 14             # delete orphaned backup dirs older than this
    image: "amazon/aws-cli:2.17.0"
  restorePointSync:
    enabled: false
    schedule: "*/30 * * * *"     # refresh restore-point file frequently
    image: "amazon/aws-cli:2.17.0"
  backupDataCompression: ""    # optional: "gzip" to compress base backups
  backupWalCompression: ""     # optional: "gzip" to compress archived WAL
  weeklyExport:
    enabled: false
    schedule: "30 3 * * 0"      # weekly (UTC)
    retentionDays: 60
    pgDumpImage: "postgres:16-alpine"
    pgDumpCompress: 9
    uploadImage: "rclone/rclone:1.66.0"
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  pooler:
    enabled: false
    maxClientConn: 200
    defaultPoolSize: 20


monitoring:
  enabled: false
