# Prod environment — Hetzner K3s
image:
  repository: ghcr.io/petz15/helvex
  tag: latest
  pullPolicy: Always

mlImage:
  repository: ghcr.io/petz15/helvex-ml
  tag: latest
  pullPolicy: Always

replicaCount: 1

frontend:
  image:
    repository: ghcr.io/petz15/helvex-frontend
    tag: latest
    pullPolicy: Always
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 500m     # requests == limits → Guaranteed QoS
      memory: 512Mi

ingress:
  host: helvex.dicy.ch
  tls: true
  tlsSecret: helvex-tls
  exposeDocs: false
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod

resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    cpu: 1000m
    memory: 1Gi

imagePullSecrets:
  - name: ghcr-pull-secret


apiWorker:
  enabled: true
  replicaCount: 2
  concurrency: 2
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

mlWorker:
  enabled: true
  # 1 job at a time — playwright crawls already fork 2 Chromium per job.
  concurrency: 1
  nodeSelector: {workload: ml}
  tolerations:
    - key: workload
      operator: Equal
      value: ml
      effect: NoSchedule
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
    limits:
      cpu: "3"
      memory: 6Gi

crawlerHttpWorker:
  enabled: true
  replicaCount: 2
  # 2 jobs/pod × crawl_concurrency 10 = up to 20 in-flight crawls per pod.
  # Raise the memory limit below before raising this — see values.yaml.
  concurrency: 2
  # 1Gi -> 2Gi: this pod now also runs web_extract, which was ML-worker-only.
  # Peak here is roughly Python+SQLAlchemy (~250M) + lingua (~150M) + the four
  # spaCy NER models the extractor loads lazily per language (~400M) +
  # CRAWL_PAGE_WORKERS soup churn (~240M) + one capped extract blob set
  # (_MAX_EXTRACT_BLOB_BYTES 16M, ~100M with parse transients) ≈ 1.1–1.2Gi.
  # 1Gi had no headroom for that; the ML worker only absorbed it because it has 6Gi.
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi

postgres:
  enabled: true
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4
  instances: 1
  storageSize: 40Gi
  backupEnabled: true
  restoreFromBackup: true
  s3EndpointUrl: "https://nbg1.your-objectstorage.com"
  s3BucketPath: "s3://helvex-backups/pg-prod/"
  # Pinned explicitly so no deploy path can leave them empty. An empty value makes CNPG
  # fall back to the cluster name and start a fresh lineage — see the 2026-08-20 incident.
  # `helvex-pg` IS the live lineage: WAL archiving has run into it continuously since
  # 2026-08-20 and it holds the newest completed base backups.
  #
  # These two being EQUAL is correct only for the currently running cluster: no bootstrap
  # happens, externalClusters is inert, and the cluster simply keeps archiving where it
  # already archives.
  #
  # !! DISASTER RECOVERY — do NOT apply these values as-is to a cluster that has to bootstrap
  # from backup. A recovering cluster cannot archive WAL into the prefix it restores from
  # (barman-cloud-check-wal-archive requires an empty destination; a non-empty one wedges the
  # cluster in "Setting up primary"). The deploy workflow handles this: with no live Cluster
  # present it generates a fresh timestamped backupServerName and refuses to proceed if the two
  # names would collide. A MANUAL `helmfile -e prod apply` bypasses that guard, so for DR always
  # pass --set postgres.backupServerName=helvex-pg-$(date -u +%Y%m%dT%H%M%SZ) and leave
  # restoreSourceServerName pointing at the lineage you are recovering from.
  backupServerName: "helvex-pg"
  restoreSourceServerName: "helvex-pg"
  backupSchedule: "0 0 2 * * *"
  backupRetention: "14d"  # 14-day PITR window
  backupPrune:
    # SUSPENDED 2026-10-07. The prune script resolves "current" from the pg-backup-meta
    # ConfigMap, which only the [deploy-prod] path writes, so it had drifted to the old
    # lineage and was one Sunday away from deleting the live one. Re-enable only after
    # it reads serverName from the live Cluster spec. See roadmap.
    enabled: false
    schedule: "0 4 * * 0"     # weekly Sunday 04:00 UTC
    retentionDays: 14
  restorePointSync:
    enabled: true
    schedule: "*/30 * * * *"
  backupDataCompression: "gzip"
  backupWalCompression: "gzip"
  weeklyExport:
    enabled: true
    # Sunday 10:00 UTC, moved off 03:30 on 2026-10-07. Now that the dump may run up to 6 h
    # (dumpTimeoutSeconds below) instead of being killed at 30 min, 03:30 would have overlapped
    # the daily 02:00 base backup for hours. Base backups are daily, so this is the widest gap
    # available: 8 h of clear air after 02:00. If base backups start failing again, check whether
    # one was still running when the dump began — contention is the leading unproven hypothesis
    # for the 2026-04→10 failures.
    schedule: "0 10 * * 0"   # weekly export to Storage Box (UTC)
    retentionDays: 60
    pgDumpCompress: 1
    dumpTimeoutSeconds: 21600   # 6 h; the DB is ~111 GB as of 2026-10-07
    minFreeStagingGb: 40
    excludeTableData:
      # ~13 GB of pgvector embeddings, fully regenerable from company purpose text by
      # the embedding job. Schema is still dumped, only the rows are skipped. Physical
      # CNPG backups are block-level and keep them regardless.
      - public.company_embeddings
  pooler:
    enabled: false

monitoring:
  enabled: false   # kube-prometheus-stack not installed; set true only after monitoring release is enabled in helmfile
