# Prod environment — Hetzner K3s
image:
  repository: ghcr.io/petz15/helvex
  tag: latest
  pullPolicy: Always

mlImage:
  repository: ghcr.io/petz15/helvex-ml
  tag: latest
  pullPolicy: Always

replicaCount: 1

frontend:
  image:
    repository: ghcr.io/petz15/helvex-frontend
    tag: latest
    pullPolicy: Always
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 500m     # requests == limits → Guaranteed QoS
      memory: 512Mi

ingress:
  host: helvex.dicy.ch
  tls: true
  tlsSecret: helvex-tls
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod

resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    cpu: 1000m
    memory: 1Gi

imagePullSecrets:
  - name: ghcr-pull-secret

zefixWorker:
  enabled: true

apiWorker:
  enabled: true

mlWorker:
  enabled: true
  replicaCount: 1  # Runs continuously; Option B (KEDA autoscaling) will replace this
  keda:
    enabled: false  # Set to true after KEDA + Hetzner Cluster Autoscaler are installed
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
    limits:
      cpu: "3"
      memory: 6Gi
  # Dedicated ML nodes only; enable fallback once autoscaler node group is ready.
  nodeSelector: {workload: ml}
  tolerations:
    - key: workload
      operator: Equal
      value: ml
      effect: NoSchedule

postgres:
  enabled: true
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4
  instances: 1
  storageSize: 40Gi
  backupEnabled: true
  restoreFromBackup: true
  s3EndpointUrl: "https://nbg1.your-objectstorage.com"
  s3BucketPath: "s3://helvex-backups/pg-prod/"
  backupSchedule: "0 0 2 * * *"
  backupRetention: "7d"  # 7-day PITR window
  backupPrune:
    enabled: true
    schedule: "0 4 * * 0"     # weekly Sunday 04:00 UTC
    retentionDays: 14
  restorePointSync:
    enabled: true
    schedule: "*/30 * * * *"
  backupDataCompression: "gzip"
  backupWalCompression: "gzip"
  weeklyExport:
    enabled: true
    schedule: "30 3 * * 0"   # weekly export to Storage Box (UTC)
    retentionDays: 60
  pooler:
    enabled: false

monitoring:
  enabled: false   # kube-prometheus-stack not installed; set true only after monitoring release is enabled in helmfile
